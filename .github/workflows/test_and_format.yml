name: Flutter Test and Format

on:
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test bin

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test bin

      - name: Run tests
        run: flutter test test

  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate from .feature files
        run: dart run bdd_flutter build

      - name: Check generated files are committed
        run: |
          git diff --exit-code -- test || (echo "::error::Generated files are out of date. Run 'dart run bdd_flutter build' in example/ and commit." && exit 1)

      - name: Run tests
        run: flutter test
