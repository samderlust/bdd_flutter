name: bdd_flutter
description: A Flutter package for Behavior-Driven Development (BDD) testing.
version: 2.0.0
homepage: https://github.com/samderlust/bdd_flutter
funding:
  - https://www.buymeacoffee.com/samderlust

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

topics:
  - bdd
  - test
  - widgettest
  - gherkin

dependencies:
  cucumber_gherkin: ^42.0.1
  cucumber_messages: ^34.2.1
  yaml: ^3.1.0

dev_dependencies:
  flutter_lints: ^2.0.1
  test: ^1.24.0
  flutter_test:
    sdk: flutter
